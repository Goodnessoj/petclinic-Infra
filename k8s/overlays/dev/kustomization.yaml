apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: petclinic-dev

labels:
  - pairs:
      petclinic.io/environment: dev
    includeSelectors: true

images:
  - name: petclinic/config-server
    newName: 974263620909.dkr.ecr.us-east-2.amazonaws.com/petclinic-dev-config-server
    newTag: latest
  - name: petclinic/discovery-server
    newName: 974263620909.dkr.ecr.us-east-2.amazonaws.com/petclinic-dev-discovery-server
    newTag: latest
  - name: petclinic/customers-service
    newName: 974263620909.dkr.ecr.us-east-2.amazonaws.com/petclinic-dev-customers-service
    newTag: latest
  - name: petclinic/visits-service
    newName: 974263620909.dkr.ecr.us-east-2.amazonaws.com/petclinic-dev-visits-service
    newTag: latest
  - name: petclinic/vets-service
    newName: 974263620909.dkr.ecr.us-east-2.amazonaws.com/petclinic-dev-vets-service
    newTag: latest
  - name: petclinic/genai-service
    newName: 974263620909.dkr.ecr.us-east-2.amazonaws.com/petclinic-dev-genai-service
    newTag: latest
  - name: petclinic/api-gateway
    newName: 974263620909.dkr.ecr.us-east-2.amazonaws.com/petclinic-dev-api-gateway
    newTag: latest
  - name: petclinic/admin-server
    newName: 974263620909.dkr.ecr.us-east-2.amazonaws.com/petclinic-dev-admin-server
    newTag: latest

patches:
  - target:
      kind: Namespace
      name: petclinic
    patch: |-
      - op: replace
        path: /metadata/name
        value: petclinic-dev
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 768Mi
