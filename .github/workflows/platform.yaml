name: Platform

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "helm/petclinic-secrets/**"
      - "helm-values/secrets-*.yaml"
      - "k8s/argocd/**"
      - ".github/workflows/platform.yaml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "helm/petclinic-secrets/**"
      - "helm-values/secrets-*.yaml"
      - "k8s/argocd/**"
      - ".github/workflows/platform.yaml"
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run.
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy
      bootstrap_gitops:
        description: Apply dev ArgoCD apps and runtime secrets after Terraform apply.
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_VERSION: 1.10.5
  TF_WORKING_DIR: terraform/environments/dev
  TF_VARS_FILE: terraform.tfvars

  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN || secrets.AWS_ROLE_TO_ASSUME || vars.AWS_ROLE_ARN || '' }}

  DEPLOY_ENV: dev
  DEFAULT_CLUSTER_NAME: petclinic-dev-eks
  DEFAULT_APP_NAMESPACE: petclinic-dev
  ARGOCD_NAMESPACE: argocd
  SECRETS_CHART: helm/petclinic-secrets
  SECRETS_RELEASE_NAME: petclinic-secrets

  TF_VAR_create_openai_secret: "false"
  TF_VAR_argocd_repo_url: https://github.com/Goodnessoj/petclinic-Infra.git
  TF_VAR_argocd_repo_token: ${{ secrets.ARGOCD_REPO_TOKEN || '' }}

jobs:
  platform:
    name: Plan or apply dev platform
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve run mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail

          ACTION="${{ github.event.inputs.action || '' }}"
          BOOTSTRAP_GITOPS="${{ github.event.inputs.bootstrap_gitops || 'true' }}"

          if [ -z "$ACTION" ]; then
            ACTION="plan"
          fi

          if [ "$ACTION" != "plan" ] && \
             [ "$ACTION" != "apply" ] && \
             [ "$ACTION" != "destroy" ]; then
            echo "Unsupported action: $ACTION" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && \
             [ "$ACTION" != "plan" ]; then
            echo "Push and pull_request events may only run plan." >&2
            exit 1
          fi

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "bootstrap_gitops=$BOOTSTRAP_GITOPS" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Set up kubectl
        if: steps.mode.outputs.action == 'apply' && steps.mode.outputs.bootstrap_gitops == 'true'
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        if: steps.mode.outputs.action == 'apply' && steps.mode.outputs.bootstrap_gitops == 'true'
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Install jq
        if: steps.mode.outputs.action == 'apply' && steps.mode.outputs.bootstrap_gitops == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: gha-platform-dev-${{ github.run_id }}
          unset-current-credentials: true

      - name: Confirm AWS identity
        run: |
          aws sts get-caller-identity

      - name: Terraform format check
        run: terraform -chdir="$TF_WORKING_DIR" fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir="$TF_WORKING_DIR" init -input=false

      - name: Terraform validate
        run: terraform -chdir="$TF_WORKING_DIR" validate -no-color

      - name: Terraform plan
        shell: bash
        run: |
          set -euo pipefail

          PLAN_ARGS=(
            -input=false
            -no-color
            -lock-timeout=5m
            -var-file="$TF_VARS_FILE"
            -out=tfplan
          )

          if [ "${{ steps.mode.outputs.action }}" = "destroy" ]; then
            terraform -chdir="$TF_WORKING_DIR" plan -destroy "${PLAN_ARGS[@]}"
          else
            terraform -chdir="$TF_WORKING_DIR" plan "${PLAN_ARGS[@]}"
          fi

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && steps.mode.outputs.action == 'apply'
        run: terraform -chdir="$TF_WORKING_DIR" apply -input=false -auto-approve tfplan

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && steps.mode.outputs.action == 'destroy'
        run: terraform -chdir="$TF_WORKING_DIR" apply -input=false -auto-approve tfplan

      - name: Export Terraform outputs
        if: steps.mode.outputs.action == 'apply' && steps.mode.outputs.bootstrap_gitops == 'true'
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER_NAME="$(terraform -chdir="$TF_WORKING_DIR" output -raw eks_cluster_name 2>/dev/null || true)"
          APP_NAMESPACE="$(terraform -chdir="$TF_WORKING_DIR" output -raw application_namespace 2>/dev/null || true)"

          if [ -z "$CLUSTER_NAME" ]; then
            CLUSTER_NAME="$DEFAULT_CLUSTER_NAME"
          fi

          if [ -z "$APP_NAMESPACE" ]; then
            APP_NAMESPACE="$DEFAULT_APP_NAMESPACE"
          fi

          echo "CLUSTER_NAME=$CLUSTER_NAME" >> "$GITHUB_ENV"
          echo "APP_NAMESPACE=$APP_NAMESPACE" >> "$GITHUB_ENV"

      - name: Update kubeconfig
        if: steps.mode.outputs.action == 'apply' && steps.mode.outputs.bootstrap_gitops == 'true'
        run: |
          aws eks update-kubeconfig \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION"

          kubectl config current-context

      - name: Verify Kubernetes authentication
        if: steps.mode.outputs.action == 'apply' && steps.mode.outputs.bootstrap_gitops == 'true'
        run: |
          kubectl auth can-i get namespaces
          kubectl get nodes

      - name: Create app namespace
        if: steps.mode.outputs.action == 'apply' && steps.mode.outputs.bootstrap_gitops == 'true'
        run: |
          kubectl create namespace "$APP_NAMESPACE" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Validate External Secrets prerequisites
        if: steps.mode.outputs.action == 'apply' && steps.mode.outputs.bootstrap_gitops == 'true'
        shell: bash
        run: |
          set -euo pipefail

          SECRETS_VALUES_FILE="helm-values/secrets-${DEPLOY_ENV}.yaml"
          CLUSTER_SECRET_STORE="$(awk '/^[[:space:]]*secretStoreName:/ { print $2; exit }' "$SECRETS_VALUES_FILE")"

          if [ -z "$CLUSTER_SECRET_STORE" ]; then
            echo "Unable to resolve secretStoreName from $SECRETS_VALUES_FILE." >&2
            exit 1
          fi

          if ! kubectl get crd externalsecrets.external-secrets.io >/dev/null 2>&1; then
            echo "ExternalSecret CRD is missing. Terraform addons did not finish installing External Secrets." >&2
            exit 1
          fi

          if ! kubectl get crd clustersecretstores.external-secrets.io >/dev/null 2>&1; then
            echo "ClusterSecretStore CRD is missing. Terraform addons did not finish installing External Secrets." >&2
            exit 1
          fi

          if ! kubectl get clustersecretstore "$CLUSTER_SECRET_STORE" >/dev/null 2>&1; then
            echo "ClusterSecretStore '$CLUSTER_SECRET_STORE' is missing. Terraform addons did not finish applying." >&2
            exit 1
          fi

      - name: Create or update OpenAI secret
        if: steps.mode.outputs.action == 'apply' && steps.mode.outputs.bootstrap_gitops == 'true'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "GitHub secret OPENAI_API_KEY is missing or empty." >&2
            exit 1
          fi

          kubectl delete externalsecret petclinic-openai-secret \
            --namespace "$APP_NAMESPACE" \
            --ignore-not-found

          kubectl delete secret openai-secret \
            --namespace "$APP_NAMESPACE" \
            --ignore-not-found

          kubectl create secret generic openai-secret \
            --namespace "$APP_NAMESPACE" \
            --from-literal=SPRING_AI_OPENAI_API_KEY="$OPENAI_API_KEY" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Install shared ExternalSecrets chart
        if: steps.mode.outputs.action == 'apply' && steps.mode.outputs.bootstrap_gitops == 'true'
        run: |
          helm upgrade --install "$SECRETS_RELEASE_NAME" "$SECRETS_CHART" \
            --namespace "$APP_NAMESPACE" \
            --create-namespace \
            --wait \
            --timeout 5m \
            --cleanup-on-fail \
            -f "helm-values/secrets-${DEPLOY_ENV}.yaml" \
            --set openai.enabled=false

      - name: Wait for database secret
        if: steps.mode.outputs.action == 'apply' && steps.mode.outputs.bootstrap_gitops == 'true'
        run: |
          set -euo pipefail

          for _ in $(seq 1 40); do
            if kubectl get secret mysql-secret --namespace "$APP_NAMESPACE" >/dev/null 2>&1; then
              echo "mysql-secret exists."
              exit 0
            fi

            sleep 5
          done

          kubectl get externalsecret petclinic-db-secret \
            --namespace "$APP_NAMESPACE" \
            -o yaml || true

          echo "mysql-secret was not created by External Secrets within the timeout window." >&2
          exit 1

      - name: Apply ArgoCD dev applications
        if: steps.mode.outputs.action == 'apply' && steps.mode.outputs.bootstrap_gitops == 'true'
        run: |
          kubectl apply -f k8s/argocd/applications/project.yaml
          kubectl apply -k k8s/argocd/applications/dev

          for APP in \
            config-server-dev \
            discovery-server-dev \
            customers-service-dev \
            vets-service-dev \
            visits-service-dev \
            genai-service-dev \
            api-gateway-dev \
            admin-server-dev; do
            kubectl annotate application "$APP" \
              --namespace "$ARGOCD_NAMESPACE" \
              argocd.argoproj.io/refresh=hard \
              --overwrite
          done

      - name: Wait for ArgoCD dev applications
        if: steps.mode.outputs.action == 'apply' && steps.mode.outputs.bootstrap_gitops == 'true'
        shell: bash
        run: |
          set -euo pipefail

          APPS='[
            "config-server-dev",
            "discovery-server-dev",
            "customers-service-dev",
            "vets-service-dev",
            "visits-service-dev",
            "genai-service-dev",
            "api-gateway-dev",
            "admin-server-dev"
          ]'

          for _ in $(seq 1 60); do
            READY_COUNT="$(kubectl get applications \
              --namespace "$ARGOCD_NAMESPACE" \
              -o json | jq --argjson apps "$APPS" '
                [ .items[]
                  | select(.metadata.name as $name | $apps | index($name))
                  | select(.status.sync.status == "Synced")
                  | select(.status.health.status == "Healthy")
                ] | length
              ')"

            if [ "$READY_COUNT" -eq 8 ]; then
              kubectl get applications --namespace "$ARGOCD_NAMESPACE" -o wide
              exit 0
            fi

            kubectl get applications --namespace "$ARGOCD_NAMESPACE" -o wide
            sleep 10
          done

          echo "ArgoCD dev Applications did not become Synced and Healthy in time." >&2
          kubectl get applications --namespace "$ARGOCD_NAMESPACE" -o wide
          exit 1

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Platform workflow"
            echo "- Environment: \`dev\`"
            echo "- Action: \`${{ steps.mode.outputs.action || 'plan' }}\`"
            echo "- Terraform directory: \`$TF_WORKING_DIR\`"
            echo "- Terraform vars: \`$TF_WORKING_DIR/$TF_VARS_FILE\`"
            echo "- AWS region: \`$AWS_REGION\`"
            echo "- GitOps bootstrap: \`${{ steps.mode.outputs.bootstrap_gitops || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
