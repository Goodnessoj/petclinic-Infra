name: Deploy Helm Chart

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy.
        required: true
        default: dev
        type: choice
        options:
          - dev
      services:
        description: Space-separated services to deploy, or all.
        required: true
        default: all
        type: string

  repository_dispatch:
    types: [deploy-helm]

  push:
    tags:
      - "*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: helm-deploy-${{ github.event.client_payload.environment || github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'petclinic-dev-eks' }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'petclinic-dev' }}
  HELM_CHART_PATH: helm/petclinic-service
  HELM_ENV_VALUES: helm-values/dev.yaml
  OPENAI_SECRET_NAME: openai-secret
  OPENAI_SECRET_KEY: SPRING_AI_OPENAI_API_KEY
  DEFAULT_SERVICES: >-
    config-server
    discovery-server
    customers-service
    vets-service
    visits-service
    genai-service
    api-gateway
    admin-server

jobs:
  deploy:
    name: Deploy Helm releases
    runs-on: ubuntu-latest
    environment: ${{ github.event.client_payload.environment || github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout platform repo
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm AWS identity
        run: |
          aws sts get-caller-identity

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Confirm Kubernetes access
        run: |
          kubectl get nodes
          kubectl get namespace "${K8S_NAMESPACE}" || true

      - name: Resolve services
        id: services
        env:
          DISPATCH_SERVICES: ${{ github.event.client_payload.services || '' }}
          INPUT_SERVICES: ${{ github.event.inputs.services || '' }}
        run: |
          set -euo pipefail

          SERVICES="${INPUT_SERVICES}"

          if [ -z "${SERVICES}" ] || [ "${SERVICES}" = "all" ]; then
            SERVICES="${DISPATCH_SERVICES}"
          fi

          if [ -z "${SERVICES}" ] || [ "${SERVICES}" = "all" ]; then
            SERVICES="${DEFAULT_SERVICES}"
          fi

          echo "Resolved services: ${SERVICES}"
          echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"

      - name: Create namespace
        run: |
          kubectl create namespace "${K8S_NAMESPACE}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Sync OpenAI API key if needed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERVICES: ${{ steps.services.outputs.services }}
        run: |
          set -euo pipefail

          NEED_OPENAI="false"

          for SERVICE in ${SERVICES}; do
            if [ "${SERVICE}" = "genai-service" ]; then
              NEED_OPENAI="true"
            fi
          done

          if [ "${NEED_OPENAI}" = "true" ]; then
            if [ -z "${OPENAI_API_KEY}" ]; then
              echo "OPENAI_API_KEY GitHub secret is required because genai-service is being deployed." >&2
              exit 1
            fi

            kubectl -n "${K8S_NAMESPACE}" create secret generic "${OPENAI_SECRET_NAME}" \
              --from-literal="${OPENAI_SECRET_KEY}=${OPENAI_API_KEY}" \
              --dry-run=client \
              -o yaml | kubectl apply -f -

            echo "OpenAI secret synced."
          else
            echo "genai-service is not being deployed. Skipping OpenAI secret sync."
          fi

      - name: Deploy services with Helm
        env:
          SERVICES: ${{ steps.services.outputs.services }}
        run: |
          set -euo pipefail

          echo "Deploying services: ${SERVICES}"

          for SERVICE in ${SERVICES}; do
            VALUES_FILE="helm-values/${SERVICE}.yaml"

            if [ ! -f "${VALUES_FILE}" ]; then
              echo "Missing values file: ${VALUES_FILE}" >&2
              exit 1
            fi

            echo "----------------------------------------"
            echo "Deploying ${SERVICE}"
            echo "Using values:"
            echo "  ${HELM_ENV_VALUES}"
            echo "  ${VALUES_FILE}"
            echo "----------------------------------------"

            echo "Rendered image:"
            helm template "${SERVICE}" "${HELM_CHART_PATH}" \
              --namespace "${K8S_NAMESPACE}" \
              --values "${HELM_ENV_VALUES}" \
              --values "${VALUES_FILE}" | grep "image:" || true

            echo "Checking current Helm release status..."

            STATUS="not-found"

            if helm status "${SERVICE}" --namespace "${K8S_NAMESPACE}" >/dev/null 2>&1; then
              STATUS="$(helm status "${SERVICE}" \
                --namespace "${K8S_NAMESPACE}" \
                --output json | jq -r '.info.status')"
            fi

            echo "Current status for ${SERVICE}: ${STATUS}"

            if [ "${STATUS}" = "failed" ] || \
               [ "${STATUS}" = "pending-install" ] || \
               [ "${STATUS}" = "pending-upgrade" ] || \
               [ "${STATUS}" = "pending-rollback" ] || \
               [ "${STATUS}" = "uninstalling" ] || \
               [ "${STATUS}" = "uninstalled" ]; then

              echo "Cleaning broken Helm release: ${SERVICE}"

              helm uninstall "${SERVICE}" \
                --namespace "${K8S_NAMESPACE}" \
                --no-hooks || true

              echo "Deleting leftover Helm release secrets for ${SERVICE}, if any..."

              kubectl delete secret \
                --namespace "${K8S_NAMESPACE}" \
                -l "owner=helm,name=${SERVICE}" || true
            fi

            echo "Installing/upgrading ${SERVICE}..."

            helm upgrade --install "${SERVICE}" "${HELM_CHART_PATH}" \
              --namespace "${K8S_NAMESPACE}" \
              --create-namespace \
              --values "${HELM_ENV_VALUES}" \
              --values "${VALUES_FILE}" \
              --rollback-on-failure \
              --wait \
              --timeout 15m

            echo "${SERVICE} deployed successfully."
          done

      - name: Show final deployment status
        if: always()
        run: |
          echo "Helm releases:"
          helm list -n "${K8S_NAMESPACE}" --all || true

          echo ""
          echo "Pods:"
          kubectl get pods -n "${K8S_NAMESPACE}" -o wide || true

          echo ""
          echo "Services:"
          kubectl get svc -n "${K8S_NAMESPACE}" || true

          echo ""
          echo "Ingress:"
          kubectl get ingress -n "${K8S_NAMESPACE}" || true