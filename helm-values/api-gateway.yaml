nameOverride: api-gateway

image:
  name: api-gateway

service:
  port: 80
  targetPort: 8080

env:
  SPRING_PROFILES_ACTIVE: docker
  CONFIG_SERVER_URL: http://config-server:8888/
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/

extraInitContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        until wget -q -T 2 -O- http://config-server:8888 >/dev/null 2>&1; do
          echo "waiting for config-server"
          sleep 5
        done

autoscaling:
  enabled: true

pdb:
  enabled: true

monitoring:
  podMonitor:
    enabled: true

ingress:
  enabled: false
  host: ""
  certificateArn: ""
  albName: ""
