nameOverride: genai-service

image:
  registry: 974263620909.dkr.ecr.us-east-2.amazonaws.com
  repository: petclinic-dev-genai-service
  tag: "a9352bb"
  pullPolicy: IfNotPresent

service:
  port: 8084
  targetPort: 8084

env:
  SPRING_PROFILES_ACTIVE: docker
  CONFIG_SERVER_URL: http://config-server:8888/
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/

secretEnv:
  - name: SPRING_AI_OPENAI_API_KEY
    secretName: openai-secret
    secretKey: SPRING_AI_OPENAI_API_KEY

extraInitContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        until wget -q -T 2 -O- http://config-server:8888 >/dev/null 2>&1; do
          echo "waiting for config-server"
          sleep 5
        done

pdb:
  enabled: true
