nameOverride: genai-service

image:
  name: genai-service

service:
  port: 8084
  targetPort: 8084

secretEnv:
  - name: SPRING_AI_OPENAI_API_KEY
    secretName: genai-service-openai-secret
    secretKey: SPRING_AI_OPENAI_API_KEY

externalSecret:
  enabled: true
  target:
    name: genai-service-openai-secret
  data:
    - secretKey: SPRING_AI_OPENAI_API_KEY
      remoteRef:
        key: petclinic/dev/terraform/openai-api-key
        property: OPENAI_API_KEY

env:
  SPRING_PROFILES_ACTIVE: docker
  CONFIG_SERVER_URL: http://config-server:8888/
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/

extraInitContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        until wget -q -T 2 -O- http://config-server:8888 >/dev/null 2>&1; do
          echo "waiting for config-server"
          sleep 5
        done

autoscaling:
  enabled: true

pdb:
  enabled: true

monitoring:
  podMonitor:
    enabled: true
